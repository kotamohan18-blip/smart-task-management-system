<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            let userTheme = savedTheme;
            if (!userTheme) {
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    try {
                        const user = JSON.parse(userStr);
                        userTheme = user.preferences?.theme;
                    } catch(e) {}
                }
            }
            if (userTheme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.add('light-theme');
            }
        })();
    </script>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-bolt text-primary"></i> <span>TaskMaster</span>
                <button class="mobile-menu-close d-md-none"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="user-profile-sm">
                <img src="https://ui-avatars.com/api/?name=User" id="sidebar-avatar" class="avatar">
                <div class="user-info">
                    <h4 id="sidebar-name">Loading...</h4>
                    <span class="badge badge-streak"><i class="fas fa-fire"></i> <span id="sidebar-streak">0</span> Days</span>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a>
                </li>
                <li class="nav-item">
                    <a href="tasks.html" class="nav-link"><i class="fas fa-tasks"></i> <span>Tasks</span></a>
                </li>
                <li class="nav-item active">
                    <a href="calendar.html" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Calendar</span></a>
                </li>
                <li class="nav-item">
                    <a href="achievements.html" class="nav-link"><i class="fas fa-trophy"></i> <span>Achievements</span></a>
                </li>
            </ul>

            <div class="sidebar-bottom">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="theme-toggle"><i class="fas fa-moon"></i> <span>Dark Mode</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="profile.html" class="nav-link"><i class="fas fa-cog"></i> <span>Settings</span></a>
                    </li>
                    <li class="nav-item mt-2">
                        <a href="#" id="logout-btn" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-open d-md-none"><i class="fas fa-bars"></i></button>
                <div class="page-title">
                    <h1>Calendar</h1>
                    <p class="text-muted">Schedule and visualize your tasks.</p>
                </div>
                <div class="topbar-actions">
                    <div class="calendar-controls">
                        <button class="btn-icon" id="prev-month"><i class="fas fa-chevron-left"></i></button>
                        <h3 id="current-month-year" class="m-0 mx-3">Month Year</h3>
                        <button class="btn-icon" id="next-month"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="profile-dropdown">
                        <button class="profile-dropdown-toggle" id="profile-dropdown-btn">
                            <img src="https://ui-avatars.com/api/?name=User" alt="Avatar" id="topbar-avatar" class="avatar-sm">
                            <span id="topbar-username">Loading...</span>
                            <i class="fas fa-chevron-down" style="font-size: 0.75rem; margin-left: 0.25rem;"></i>
                        </button>
                        <div class="dropdown-menu" id="profile-dropdown-menu">
                            <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                            <a href="profile.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                            <hr class="dropdown-divider">
                            <a href="#" class="dropdown-item text-danger" id="dropdown-logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="glass-card p-0">
                    <div class="calendar-wrapper">
                        <div class="calendar-header">
                            <div>Sun</div>
                            <div>Mon</div>
                            <div>Tue</div>
                            <div>Wed</div>
                            <div>Thu</div>
                            <div>Fri</div>
                            <div>Sat</div>
                        </div>
                        <div class="calendar-grid" id="calendar-grid">
                            <!-- Days generated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Day View Modal -->
    <div class="modal-overlay" id="day-modal">
        <div class="modal-dialog glass-card">
            <div class="modal-header">
                <h3 id="day-modal-title">Tasks for Date</h3>
                <button class="btn-icon close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="day-modal-body">
                <!-- Task list generated by JS -->
            </div>
            <div class="modal-footer">
                <a href="tasks.html" class="btn btn-primary w-100 text-center">Manage Tasks</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
