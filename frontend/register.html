<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body light-theme">
    <div class="split-layout">
        <div class="split-left">
            <div class="split-content">
                <a href="index.html" class="logo mb-4" style="color: white; font-size: 1.5rem;">
                    <i class="fas fa-bolt"></i> TaskMaster
                </a>
                <h1 class="split-title">Start Your<br>Journey<br>Today.</h1>
                <p class="split-subtitle">Join thousands of professionals and students managing their tasks efficiently.</p>
                
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                </div>
            </div>
        </div>
        
        <div class="split-right">
            <div class="auth-card glass-card">
                <div class="auth-header">
                    <h2>Create an Account</h2>
                    <p>Start organizing your life in seconds.</p>
                </div>
                
                <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                
                <form id="register-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
                            <button type="button" class="btn-icon password-toggle"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your password" required minlength="6">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">Create Account</button>
                </form>
                
                <div class="auth-footer mt-4 text-center">
                    <p>Already have an account? <a href="login.html" class="text-primary font-weight-600">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark-theme");
    }
});
</script>
</body>
</html>
