<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            let userTheme = savedTheme;
            if (!userTheme) {
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    try {
                        const user = JSON.parse(userStr);
                        userTheme = user.preferences?.theme;
                    } catch(e) {}
                }
            }
            if (userTheme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.add('light-theme');
            }
        })();
    </script>
    <div class="split-layout">
        <div class="split-left">
            <div class="split-content">
                <a href="index.html" class="logo mb-4" style="color: white; font-size: 1.5rem;">
                    <i class="fas fa-bolt"></i> TaskMaster
                </a>
                <h1 class="split-title">Plan.<br>Focus.<br>Achieve.</h1>
                <p class="split-subtitle">Transform your productivity with intelligent task management and smart scheduling.</p>
                
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                </div>
            </div>
        </div>
        
        <div class="split-right">
            <div class="auth-card glass-card">
                <div class="auth-header">
                    <h2>Forgot Password</h2>
                    <p>Enter your details to request a password recovery link.</p>
                </div>
                
                <div id="info-message" class="alert alert-success" style="display: none; line-height: 1.6;"></div>
                <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                
                <form id="forgot-password-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">Send Reset Link</button>
                </form>
                
                <div class="auth-footer mt-4 text-center">
                    <p><a href="login.html" class="text-primary font-weight-600"><i class="fas fa-arrow-left mr-2"></i> Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            const infoMsg = document.getElementById('info-message');
            const errMsg = document.getElementById('error-message');
            
            if (!email) {
                errMsg.textContent = 'Please enter a valid email address.';
                errMsg.style.display = 'block';
                infoMsg.style.display = 'none';
                return;
            }
            
            errMsg.style.display = 'none';
            infoMsg.innerHTML = `
                <div>If an account exists for this email, password recovery instructions will be available in a future update.</div>
                <div style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.8;">Email-based password recovery is planned for a future release.</div>
            `;
            infoMsg.style.display = 'block';
            
            // Clear the form input
            emailInput.value = '';
        });
    </script>
</body>
</html>
