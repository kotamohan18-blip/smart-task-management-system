<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body light-theme">
    <div class="app-container">
        <!-- Sidebar Navigation (Same as Dashboard) -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-bolt text-primary"></i> <span>TaskMaster</span>
                <button class="mobile-menu-close d-md-none"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="user-profile-sm">
                <img src="https://ui-avatars.com/api/?name=User" id="sidebar-avatar" class="avatar">
                <div class="user-info">
                    <h4 id="sidebar-name">Loading...</h4>
                    <span class="badge badge-streak"><i class="fas fa-fire"></i> <span id="sidebar-streak">0</span> Days</span>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a>
                </li>
                <li class="nav-item active">
                    <a href="tasks.html" class="nav-link"><i class="fas fa-tasks"></i> <span>Tasks</span></a>
                </li>
                <li class="nav-item">
                    <a href="calendar.html" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Calendar</span></a>
                </li>
                <li class="nav-item">
                    <a href="achievements.html" class="nav-link"><i class="fas fa-trophy"></i> <span>Achievements</span></a>
                </li>
            </ul>

            <div class="sidebar-bottom">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="theme-toggle"><i class="fas fa-moon"></i> <span>Dark Mode</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="profile.html" class="nav-link"><i class="fas fa-cog"></i> <span>Settings</span></a>
                    </li>
                    <li class="nav-item mt-2">
                        <a href="#" id="logout-btn" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-open d-md-none"><i class="fas fa-bars"></i></button>
                <div class="page-title">
                    <h1>My Tasks</h1>
                    <p class="text-muted">Manage, organize, and prioritize your work.</p>
                </div>
                <div class="topbar-actions">
                    <div class="profile-dropdown">
                        <button class="profile-dropdown-toggle" id="profile-dropdown-btn">
                            <img src="https://ui-avatars.com/api/?name=User" alt="Avatar" id="topbar-avatar" class="avatar-sm">
                            <span id="topbar-username">Loading...</span>
                            <i class="fas fa-chevron-down" style="font-size: 0.75rem; margin-left: 0.25rem;"></i>
                        </button>
                        <div class="dropdown-menu" id="profile-dropdown-menu">
                            <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                            <a href="profile.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                            <hr class="dropdown-divider">
                            <a href="#" class="dropdown-item text-danger" id="dropdown-logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="open-task-modal"><i class="fas fa-plus mr-2"></i> New Task</button>
                </div>
            </header>

            <div class="content-wrapper">
                <div id="alert-message" class="alert" style="display: none;"></div>

                <!-- Toolbar (Search, Filter, Sort) -->
                <div class="glass-card p-3 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div class="search-wrapper flex-grow-1" style="max-width: 400px;">
                        <i class="fas fa-search input-icon"></i>
                        <input type="text" id="search-input" class="form-control" placeholder="Search tasks by title or description...">
                    </div>
                    
                    <div class="filters-wrapper d-flex gap-2">
                        <select id="filter-status" class="form-control w-auto">
                            <option value="">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Overdue">Overdue</option>
                        </select>
                        <select id="filter-priority" class="form-control w-auto">
                            <option value="">All Priorities</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                        <select id="sort-by" class="form-control w-auto">
                            <option value="-createdAt">Newest First</option>
                            <option value="dueDate">Due Date (Asc)</option>
                            <option value="-dueDate">Due Date (Desc)</option>
                            <option value="priority">Priority (High-Low)</option>
                        </select>
                    </div>
                </div>

                <!-- Tasks List -->
                <div class="glass-card">
                    <div class="table-container">
                        <table class="table w-100 task-table">
                            <thead>
                                <tr>
                                    <th width="5%"></th>
                                    <th width="40%">Task</th>
                                    <th width="15%">Category & Priority</th>
                                    <th width="20%">Schedule</th>
                                    <th width="10%">Status</th>
                                    <th width="10%" class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tasks-list">
                                <tr><td colspan="6" class="text-center py-5">Loading tasks...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-dialog glass-card">
            <div class="modal-header">
                <h3 id="modal-title">Create Task</h3>
                <button class="btn-icon close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    
                    <div class="form-group">
                        <label for="title">Title <span class="text-danger">*</span></label>
                        <input type="text" id="title" class="form-control" required placeholder="What needs to be done?">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" rows="3" placeholder="Add some details..."></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="form-group mb-0">
                            <label for="priority">Priority</label>
                            <select id="priority" class="form-control">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="form-group mb-0">
                            <label for="category">Category</label>
                            <select id="category" class="form-control">
                                <option value="Personal">Personal</option>
                                <option value="Study">Study</option>
                                <option value="Work">Work</option>
                                <option value="Fitness">Fitness</option>
                                <option value="Finance">Finance</option>
                                <option value="Other" selected>Other</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="form-group mb-0">
                            <label for="dueDate">Date <span class="text-danger">*</span></label>
                            <input type="date" id="dueDate" class="form-control" required>
                        </div>
                        <div class="form-group mb-0">
                            <label for="dueTime">Time</label>
                            <input type="time" id="dueTime" class="form-control">
                        </div>
                    </div>

                    <div class="form-group mb-3" id="status-group" style="display: none;">
                        <label for="status">Status</label>
                        <select id="status" class="form-control">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    
                    <div class="modal-footer mt-4">
                        <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-task-btn">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
