<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body light-theme">
    <div class="split-layout">
        <div class="split-left">
            <div class="split-content">
                <a href="index.html" class="logo mb-4" style="color: white; font-size: 1.5rem;">
                    <i class="fas fa-bolt"></i> TaskMaster
                </a>
                <h1 class="split-title">Plan.<br>Focus.<br>Achieve.</h1>
                <p class="split-subtitle">Transform your productivity with intelligent task management and smart scheduling.</p>
                
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                </div>
            </div>
        </div>
        
        <div class="split-right">
            <div class="auth-card glass-card">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your details to access your dashboard.</p>
                </div>
                
                <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="mb-1">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                            <button type="button" class="btn-icon password-toggle"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end mb-4">
                        <a href="#" class="text-sm text-primary font-weight-600">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">Login to Account</button>
                </form>
                
                <div class="auth-footer mt-4 text-center">
                    <p>Don't have an account? <a href="register.html" class="text-primary font-weight-600">Register now</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark-theme");
    }
});
</script>
</body>
</html>
