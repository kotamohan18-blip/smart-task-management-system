<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body light-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-bolt text-primary"></i> <span>TaskMaster</span>
                <button class="mobile-menu-close d-md-none"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="user-profile-sm">
                <img src="https://ui-avatars.com/api/?name=User" id="sidebar-avatar" class="avatar">
                <div class="user-info">
                    <h4 id="sidebar-name">Loading...</h4>
                    <span class="badge badge-streak"><i class="fas fa-fire"></i> <span id="sidebar-streak">0</span> Days</span>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a>
                </li>
                <li class="nav-item">
                    <a href="tasks.html" class="nav-link"><i class="fas fa-tasks"></i> <span>Tasks</span></a>
                </li>
                <li class="nav-item">
                    <a href="calendar.html" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Calendar</span></a>
                </li>
                <li class="nav-item">
                    <a href="achievements.html" class="nav-link"><i class="fas fa-trophy"></i> <span>Achievements</span></a>
                </li>
            </ul>

            <div class="sidebar-bottom">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="theme-toggle"><i class="fas fa-moon"></i> <span>Dark Mode</span></a>
                    </li>
                    <li class="nav-item active">
                        <a href="profile.html" class="nav-link"><i class="fas fa-cog"></i> <span>Settings</span></a>
                    </li>
                    <li class="nav-item mt-2">
                        <a href="#" id="logout-btn" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-open d-md-none"><i class="fas fa-bars"></i></button>
                <div class="page-title">
                    <h1>Settings</h1>
                    <p class="text-muted">Manage your profile and preferences.</p>
                </div>
                <div class="topbar-actions">
                    <div class="profile-dropdown">
                        <button class="profile-dropdown-toggle" id="profile-dropdown-btn">
                            <img src="https://ui-avatars.com/api/?name=User" alt="Avatar" id="topbar-avatar" class="avatar-sm">
                            <span id="topbar-username">Loading...</span>
                            <i class="fas fa-chevron-down" style="font-size: 0.75rem; margin-left: 0.25rem;"></i>
                        </button>
                        <div class="dropdown-menu" id="profile-dropdown-menu">
                            <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                            <a href="profile.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                            <hr class="dropdown-divider">
                            <a href="#" class="dropdown-item text-danger" id="dropdown-logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div id="alert-message" class="alert" style="display: none;"></div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-1">
                        <div class="glass-card text-center p-4">
                            <div class="profile-avatar-large mx-auto mb-3">
                                <img src="" id="profile-img" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%;">
                            </div>
                            <h3 id="profile-name-display" class="mb-1">Loading...</h3>
                            <p class="text-muted text-sm mb-3" id="profile-email-display">loading@example.com</p>
                            <p class="text-sm px-2 mb-4" id="profile-bio-display"></p>
                            
                            <div class="d-flex justify-content-center gap-2 mb-2">
                                <div class="badge badge-streak"><i class="fas fa-fire"></i> <span id="profile-streak">0</span></div>
                                <div class="badge bg-yellow-light text-yellow"><i class="fas fa-star"></i> <span id="profile-score">0</span> pts</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-span-2">
                        <div class="glass-card p-4">
                            <h3 class="mb-4">Edit Profile</h3>
                            <form id="profile-form">
                                <div class="form-group">
                                    <label>Full Name</label>
                                    <input type="text" id="profile-name" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Email Address</label>
                                    <input type="email" id="profile-email" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Bio</label>
                                    <textarea id="profile-bio" class="form-control" rows="3" placeholder="Tell us about yourself"></textarea>
                                </div>
                                
                                <h4 class="mt-4 mb-3 border-top pt-4">Change Password</h4>
                                <div class="form-group">
                                    <label>New Password (leave blank to keep current)</label>
                                    <input type="password" id="profile-password" class="form-control" minlength="6">
                                </div>

                                <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if(!token) return;

            try {
                const res = await fetch('https://todolist1-t3bp.onrender.com/api/users/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if(data.success) {
                    const user = data.data;
                    document.getElementById('profile-name').value = user.name;
                    document.getElementById('profile-email').value = user.email;
                    document.getElementById('profile-bio').value = user.bio || '';
                    // Displays
                    document.getElementById('profile-name-display').textContent = user.name;
                    document.getElementById('profile-email-display').textContent = user.email;
                    document.getElementById('profile-bio-display').textContent = user.bio || 'No bio provided.';
                    document.getElementById('profile-img').src = user.avatar.startsWith('http') ? user.avatar : `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}`;
                    document.getElementById('profile-streak').textContent = user.streak || 0;
                    document.getElementById('profile-score').textContent = user.productivityScore || 0;
                }
            } catch(e) {
                console.error(e);
            }

            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

                const payload = {
                    name: document.getElementById('profile-name').value,
                    email: document.getElementById('profile-email').value,
                    bio: document.getElementById('profile-bio').value
                };

                const pwd = document.getElementById('profile-password').value;
                if(pwd) payload.password = pwd;

                try {
                    const res = await fetch('https://todolist1-t3bp.onrender.com/api/users/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if(data.success) {
                        // Update localstorage
                        const userStr = localStorage.getItem('user');
                        if(userStr) {
                            const u = JSON.parse(userStr);
                            u.name = data.data.name;
                            localStorage.setItem('user', JSON.stringify(u));
                        }
                        
                        // Show success
                        const alert = document.getElementById('alert-message');
                        alert.textContent = 'Profile updated successfully!';
                        alert.className = 'alert alert-success';
                        alert.style.display = 'block';
                        setTimeout(() => alert.style.display='none', 3000);

                    }
                } catch(e) {
                    console.error(e);
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Save Changes';
                }
            });
        });
    </script>

</body>
</html>
